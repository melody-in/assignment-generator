<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Document System — ViRa.Aksh</title>
<meta name="description" content="Academic Document System for generating geospatial statistics assignments">
<link href="https://fonts.googleapis.com/css2?family=New+York:opsz,wght@6,300;6,400;6,500;6,600&family=SF+Pro+Display:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Serif+Display:ital@0;1&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: rgba(120,120,200,0.15);
    --accent: #6366f1;
    --accent2: #a5b4fc;
    --accent3: #818cf8;
    --gold: #d4af37;
    --gold2: #f0d060;
    --text: #e8e8f0;
    --text2: #a0a0c0;
    --text3: #6060a0;
    --success: #22c55e;
    --error: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Instrument Serif', 'Georgia', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated starfield bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(99,102,241,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(165,180,252,0.06) 0%, transparent 50%),
      radial-gradient(ellipse 40% 60% at 50% 50%, rgba(212,175,55,0.03) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
    opacity: 0;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; }
    50% { opacity: var(--op, 0.5); }
  }

  /* Header */
  .site-header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 64px 24px 40px;
  }

  .site-header .eyebrow {
    font-family: 'Libre Baskerville', serif;
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 16px;
    opacity: 0.8;
  }

  .site-header h1 {
    font-family: 'DM Serif Display', 'Georgia', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 400;
    line-height: 1.1;
    color: #fff;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #fff 0%, var(--accent2) 50%, var(--gold2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .site-header h1 em {
    font-style: italic;
    font-family: 'DM Serif Display', serif;
  }

  .site-header .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--text2);
    font-style: italic;
    letter-spacing: 0.02em;
  }

  .divider {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 20px auto;
  }

  /* Form card */
  .form-wrap {
    position: relative;
    z-index: 10;
    max-width: 680px;
    margin: 0 auto 48px;
    padding: 0 20px;
  }

  .glass-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 
      0 0 0 1px rgba(99,102,241,0.05),
      0 24px 80px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }

  .form-section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.72rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent3);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .form-section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .field-group {
    display: grid;
    gap: 18px;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  label {
    font-family: 'Libre Baskerville', serif;
    font-size: 10.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text2);
  }

  input, select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'Instrument Serif', serif;
    font-size: 1rem;
    outline: none;
    transition: all 0.25s ease;
    width: 100%;
  }

  input:focus, select:focus {
    border-color: var(--accent3);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    background: rgba(99,102,241,0.04);
  }

  input.field-error {
    border-color: var(--error);
    box-shadow: 0 0 0 3px rgba(239,68,68,0.15);
  }

  input.field-error:focus {
    border-color: var(--error);
    box-shadow: 0 0 0 3px rgba(239,68,68,0.25);
  }

  .error-msg {
    font-family: 'Libre Baskerville', serif;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--error);
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  .error-msg.visible {
    opacity: 1;
    max-height: 20px;
    margin-top: -4px;
  }

  input::placeholder { color: var(--text3); font-style: italic; }

  select { cursor: pointer; }
  select option { background: var(--surface); }

  .btn-generate {
    margin-top: 28px;
    width: 100%;
    padding: 16px 32px;
    background: linear-gradient(135deg, var(--accent) 0%, #4f46e5 40%, #7c3aed 100%);
    border: none;
    border-radius: 12px;
    color: white;
    font-family: 'DM Serif Display', serif;
    font-size: 1.15rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(99,102,241,0.35);
  }

  .btn-generate::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(99,102,241,0.45); }
  .btn-generate:hover::before { opacity: 1; }
  .btn-generate:active { transform: translateY(0); }

  .btn-generate:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: 0 4px 16px rgba(99,102,241,0.15);
  }

  .btn-generate .btn-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .btn-generate .icon {
    font-size: 1.3rem;
    animation: rotate-idle 8s linear infinite;
  }

  @keyframes rotate-idle {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Action buttons */
  .action-row {
    display: none;
    gap: 12px;
    margin-top: 16px;
  }

  .action-row.visible { display: flex; }

  .btn-action {
    flex: 1;
    padding: 13px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-family: 'Libre Baskerville', serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-preview {
    background: rgba(99,102,241,0.1);
    color: var(--accent2);
  }

  .btn-preview:hover { background: rgba(99,102,241,0.2); border-color: var(--accent3); }

  .btn-pdf {
    background: rgba(212,175,55,0.1);
    color: var(--gold2);
  }

  .btn-pdf:hover { background: rgba(212,175,55,0.2); border-color: var(--gold); }

  /* Preview modal */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    backdrop-filter: blur(8px);
    animation: fadeIn 0.3s ease;
  }

  .modal-backdrop.open { display: flex; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-window {
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 860px;
    min-height: 95vh;
    margin: auto;
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,0.8);
    animation: slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-bar {
    background: #f0f0f5;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #ddd;
  }

  .modal-dots { display: flex; gap: 6px; }
  .modal-dot {
    width: 12px; height: 12px; border-radius: 50%;
  }
  .modal-dot:nth-child(1) { background: #ff5f57; cursor: pointer; }
  .modal-dot:nth-child(2) { background: #ffbd2e; }
  .modal-dot:nth-child(3) { background: #28c840; }

  .modal-title {
    flex: 1;
    text-align: center;
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    font-size: 13px;
    color: #666;
    letter-spacing: 0.02em;
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #999;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.2s;
  }

  .modal-close:hover { background: #e0e0e0; }

  /* Document preview styles */
  #doc-preview {
    padding: 0;
    background: #fff;
    font-family: 'Playfair Display', 'Georgia', serif;
    color: #1a1a2e;
  }

  .doc-page {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 60px;
    min-height: 100vh;
  }

  /* Cover page */
  .cover-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(160deg, #0f0f2e 0%, #1a1040 40%, #0d1a3a 100%);
    color: white;
    padding: 60px 40px;
    position: relative;
    overflow: hidden;
  }

  .cover-page::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 30% 30%, rgba(99,102,241,0.3) 0%, transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(212,175,55,0.2) 0%, transparent 50%);
  }

  .cover-content { position: relative; z-index: 1; }

  .cover-institution {
    font-family: 'Libre Baskerville', serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(165,180,252,0.8);
    margin-bottom: 12px;
  }

  .cover-institution-sub {
    font-family: 'Libre Baskerville', serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(165,180,252,0.6);
    margin-bottom: 32px;
  }

  .cover-logo-ring {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2px solid rgba(212,175,55,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 32px;
    position: relative;
  }

  .cover-logo-ring::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,0.2);
  }

  .cover-logo-ring .globe { font-size: 3rem; }

  .cover-program-tag {
    display: inline-block;
    padding: 8px 22px;
    border: 1px solid rgba(165,180,252,0.4);
    border-radius: 30px;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent2);
    margin-bottom: 12px;
    font-family: 'Libre Baskerville', serif;
  }

  .cover-course-tag {
    display: inline-block;
    padding: 6px 18px;
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 30px;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--gold2);
    margin-bottom: 24px;
    font-family: 'Libre Baskerville', serif;
  }

  .cover-main-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.15;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 0%, rgba(165,180,252,0.9) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .cover-sub-title {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: clamp(1.1rem, 2.5vw, 1.6rem);
    color: var(--gold2);
    margin-bottom: 40px;
  }

  .cover-divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.6), transparent);
    margin: 0 auto 40px;
  }

  .cover-meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 40px;
    text-align: left;
    max-width: 420px;
    margin: 0 auto 40px;
  }

  .cover-meta-item .label {
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(165,180,252,0.6);
    font-family: 'Libre Baskerville', serif;
    margin-bottom: 3px;
  }

  .cover-meta-item .value {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    color: white;
  }

  .cover-submitted-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px 60px;
    text-align: left;
    max-width: 520px;
    margin: 0 auto 32px;
  }

  .cover-submitted-block .block-title {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(212,175,55,0.7);
    font-family: 'Libre Baskerville', serif;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(212,175,55,0.2);
    padding-bottom: 6px;
  }

  .cover-submitted-block .block-line {
    font-family: 'Playfair Display', serif;
    font-size: 0.88rem;
    color: rgba(255,255,255,0.9);
    line-height: 1.8;
  }

  .cover-submitted-block .block-line.sub {
    font-size: 0.8rem;
    color: rgba(165,180,252,0.6);
  }

  .cover-image-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }

  .cover-image-row canvas {
    border-radius: 12px;
    border: 1px solid rgba(212,175,55,0.2);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  /* TOC page */
  .toc-page {
    padding: 60px 0 40px;
    border-bottom: 1px solid #e8e8f0;
    margin-bottom: 40px;
  }

  .toc-header {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: #1a1a2e;
    margin-bottom: 8px;
  }

  .toc-subline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: #888;
    margin-bottom: 32px;
  }

  .toc-divider-line {
    height: 2px;
    background: linear-gradient(90deg, #1a1a2e, transparent);
    margin-bottom: 28px;
    width: 80px;
  }

  .toc-entry {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px dashed #e0e0ec;
    font-family: 'Playfair Display', serif;
  }

  .toc-entry .toc-num {
    font-size: 0.7rem;
    color: #6366f1;
    font-family: 'Libre Baskerville', serif;
    min-width: 28px;
    letter-spacing: 0.05em;
  }

  .toc-entry .toc-title {
    flex: 1;
    font-size: 0.95rem;
    color: #2a2a3e;
  }

  .toc-entry.h1 .toc-title { font-size: 1.05rem; font-weight: 500; color: #1a1a2e; }
  .toc-entry.h2 { padding-left: 20px; }
  .toc-entry.h2 .toc-title { font-size: 0.88rem; font-style: italic; }
  .toc-entry.h2 .toc-num { color: #a0a0c0; }

  .toc-entry .toc-dots {
    flex: 1;
    border-bottom: 1px dotted #ccc;
    min-width: 30px;
    margin-bottom: 3px;
  }

  .toc-entry .toc-pg {
    font-family: 'Libre Baskerville', serif;
    font-size: 0.8rem;
    color: #6366f1;
    min-width: 24px;
    text-align: right;
  }

  /* Content pages */
  .content-page { padding: 60px 0; }

  .topic-banner {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: white;
    padding: 32px 40px;
    border-radius: 12px;
    margin: 0 -60px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .topic-banner::after {
    content: '';
    position: absolute;
    right: -20px;
    top: -20px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(99,102,241,0.15);
  }

  .topic-banner-left .tag {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(165,180,252,0.7);
    font-family: 'Libre Baskerville', serif;
    margin-bottom: 8px;
  }

  .topic-banner-left h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    line-height: 1.2;
    color: white;
  }

  .topic-banner-right {
    font-family: 'DM Serif Display', serif;
    font-size: 2.5rem;
    color: rgba(212,175,55,0.6);
    position: relative;
    z-index: 1;
  }

  .section-heading {
    font-family: 'DM Serif Display', serif;
    font-size: 1.45rem;
    color: #1a1a2e;
    margin: 36px 0 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid #6366f1;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-heading .snum {
    background: #6366f1;
    color: white;
    font-family: 'Libre Baskerville', serif;
    font-size: 0.75rem;
    padding: 3px 9px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }

  .sub-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 500;
    color: #2a2a3e;
    margin: 24px 0 10px;
  }

  .body-text {
    font-family: 'Playfair Display', serif;
    font-size: 0.94rem;
    line-height: 1.8;
    color: #3a3a5e;
    margin-bottom: 14px;
  }

  /* Tables */
  .doc-table {
    width: 100%;
    border-collapse: collapse;
    margin: 18px 0 24px;
    font-family: 'Playfair Display', serif;
    font-size: 0.85rem;
  }

  .doc-table th {
    background: #1a1a2e;
    color: white;
    padding: 10px 14px;
    text-align: left;
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
  }

  .doc-table td {
    padding: 9px 14px;
    border-bottom: 1px solid #e8e8f4;
    color: #3a3a5e;
    line-height: 1.5;
    vertical-align: top;
  }

  .doc-table tr:nth-child(even) td { background: #f8f8ff; }

  /* Formula box */
  .formula-box {
    background: linear-gradient(135deg, #f0f0ff 0%, #f5f0ff 100%);
    border: 1px solid #c0c0e8;
    border-left: 4px solid #6366f1;
    border-radius: 8px;
    padding: 16px 20px;
    margin: 16px 0;
    font-family: 'Libre Baskerville', serif;
    font-size: 0.9rem;
    color: #1a1a3e;
    line-height: 1.6;
  }

  /* GIS example box */
  .gis-box {
    background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
    border: 1px solid #bbf7d0;
    border-left: 4px solid #22c55e;
    border-radius: 8px;
    padding: 16px 20px;
    margin: 20px 0;
  }

  .gis-box .gis-label {
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #16a34a;
    font-family: 'Libre Baskerville', serif;

// ── Generative Art Canvas ─────────────────────────────────────
function makeArt(canvas, seed, dark) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const rng = seededRng(seed);

  const palettes = [
    ['#6366f1','#818cf8','#a5b4fc','#d4af37','#f0d060'],
    ['#0ea5e9','#38bdf8','#7dd3fc','#22c55e','#86efac'],
    ['#f43f5e','#fb7185','#fda4af','#f97316','#fed7aa'],
    ['#8b5cf6','#a78bfa','#c4b5fd','#ec4899','#f9a8d4'],
    ['#10b981','#34d399','#6ee7b7','#0891b2','#67e8f9'],
  ];
  const palette = palettes[Math.floor(rng()*palettes.length)];

  const bg = ctx.createLinearGradient(0,0,w,h);
  bg.addColorStop(0, dark ? '#0a0a1e' : '#f8f8ff');
  bg.addColorStop(1, dark ? '#0d1a3a' : '#f0f0fa');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,w,h);

  ctx.fillStyle = dark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,30,0.05)';
  for(let x=10; x<w; x+=14) for(let y=10; y<h; y+=14) {
    ctx.beginPath(); ctx.arc(x,y,1,0,Math.PI*2); ctx.fill();
  }

  const n = 5 + Math.floor(rng()*8);
  for(let i=0; i<n; i++) {
    const x = rng()*w, y = rng()*h;
    const r = 15 + rng()*60;
    const col = palette[Math.floor(rng()*palette.length)];
    const type = Math.floor(rng()*4);
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rng()*Math.PI*2);
    ctx.globalAlpha = 0.12 + rng()*0.22;

    if(type === 0) {
      const grad = ctx.createRadialGradient(0,0,0,0,0,r);
      grad.addColorStop(0, col);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    } else if(type === 1) {
      ctx.fillStyle = col;
      ctx.beginPath();
      for(let j=0;j<6;j++) { const a=j*Math.PI/3; j===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
      ctx.closePath(); ctx.fill();
    } else if(type === 2) {
      ctx.strokeStyle = col;
      ctx.lineWidth = 2+rng()*4;
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
    } else {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0,-r); ctx.lineTo(r*0.866,r*0.5); ctx.lineTo(-r*0.866,r*0.5);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = dark ? 0.06 : 0.04;
  ctx.strokeStyle = palette[0];
  ctx.lineWidth = 1;
  const pts = Array.from({length:12}, ()=>({x:rng()*w,y:rng()*h}));
  for(let i=0;i<pts.length;i++) {
    for(let j=i+1;j<pts.length;j++) {
      const d = Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
      if(d < 80) { ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke(); }
    }
  }
  ctx.restore();

  ctx.fillStyle = dark ? 'rgba(255,255,255,0.2)' : 'rgba(99,102,241,0.25)';
  ctx.font = `bold ${8+rng()*6}px 'Libre Baskerville', serif`;
  ctx.textAlign = 'center';
  const labels = ['MORAN\'S I','Gi* ANALYSIS','KDE','RIPLEY\'S K','NNA','HOTSPOT','PPA'];
  ctx.fillText(labels[Math.floor(rng()*labels.length)], w/2, h-10);
}

function seededRng(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 0xffffffff;
  };
}

  const html = `

  <!-- TOPIC 1 -->
  <div class="doc-page">
    <div class="content-page">
      <div class="topic-banner">
        <div class="topic-banner-left">
          <div class="tag">MAS 744 — Geospatial Statistics- II</div>

        <div class="topic-banner-right">01</div>
      </div>

      <div class="section-heading"><span class="snum">1.1</span> Spatial Autocorrelation</div>
      <div class="sub-heading">Definition</div>
      <div class="body-text">Spatial Autocorrelation is a measure that tells us whether geographic features (like villages, rainfall stations, or land cover patches) that are close to each other are more similar or more different compared to features that are far apart. In simple words, it answers the question: <em>Are nearby things similar to each other?</em></div>
      <div class="body-text">This concept is based on the <strong>First Law of Geography</strong> proposed by Waldo Tobler (1970), which states:</div>

      <div class="sub-heading">Why is Spatial Autocorrelation Important in GIS?</div>

        <p>When mapping Land Surface Temperature (LST) using MODIS or Landsat satellite data, nearby pixels tend to have similar temperatures. This is a classic example of Positive Spatial Autocorrelation. Urban Heat Islands show strong positive autocorrelation — hot pixels cluster with other hot pixels.</p>

      <div class="section-heading"><span class="snum">1.2</span> Moran's I — The Core Measure</div>
      <div class="sub-heading">Definition</div>
      <div class="body-text">Moran's I is the most widely used statistical measure to quantify spatial autocorrelation. It was developed by <strong>Patrick Alfred Pierce Moran in 1950</strong>. It gives a single number summarising whether values are clustered, dispersed, or random — a "correlation coefficient for space."</div>

      <div class="sub-heading">Formula of Moran's I</div>
      <div class="formula-box"><strong>I = (N / W) × [ Σᵢ Σⱼ wᵢⱼ (xᵢ – x̄)(xⱼ – x̄) ] / [ Σᵢ (xᵢ – x̄)² ]</strong></div>

        <tr><td>xᵢ</td><td>Value of the variable at location i</td></tr>
        <tr><td>x̄</td><td>Mean value of the variable across all locations</td></tr>
        <tr><td>(xᵢ – x̄)(xⱼ – x̄)</td><td>Numerator: measures how neighboring locations deviate from mean together</td></tr>
        <tr><td>Σᵢ (xᵢ – x̄)²</td><td>Denominator: total variance used to normalize the result</td></tr>

        <tr><td><strong>Close to -1</strong></td><td>Strong Negative Autocorrelation (Dispersion)</td><td>Checkerboard of high/low crop yield in mixed agriculture zone</td></tr>
      </table>

      <div class="sub-heading">Statistical Testing of Moran's I</div>
      <div class="formula-box"><strong>Z-score = (I – E[I]) / √Var[I]</strong><br><br>
      <em>E[I] = -1/(N-1) &nbsp;|&nbsp; p-value &lt; 0.05 = statistically significant pattern</em></div>

      <div class="note-box">Important: Moran's I is a GLOBAL statistic. It gives one value for the entire study area. It tells you THAT clustering exists but NOT WHERE it is located. For local-level detection, we use Getis-Ord Gi*.</div>

      <div class="gis-box">
        <div class="gis-label">GIS/RS Example — NDVI Cluster Analysis</div>
        <p>A researcher uses Landsat 8 imagery to calculate NDVI for 50 sub-districts. After computing Moran's I = +0.78 with p-value &lt; 0.01, there is strong statistically significant positive spatial autocorrelation — districts with high NDVI cluster together (dense forest zones) and low-NDVI districts also cluster (degraded/urban areas). This guides conservation planning.</p>
      </div>
    </div>
    ${footerHtml(name,pid,ts,2,course)}
  </div>

  <!-- PAGE 2 -->
  <div class="doc-page">
    <div class="content-page">
      <div class="section-heading"><span class="snum">1.3</span> Getis-Ord Gi* — Local Hotspot Analysis</div>
      <div class="sub-heading">Definition</div>
      <div class="body-text">The <strong>Getis-Ord Gi*</strong> statistic (pronounced "Gee-I-Star") is a LOCAL spatial statistic that identifies specific locations which are statistically significant hotspots or coldspots. Unlike Moran's I which gives one result for the whole study area, Gi* gives a separate result (Z-score and p-value) for EVERY SINGLE location in the dataset. Developed by Getis and Ord in 1992.</div>

      <div class="formula-box"><strong>Gi* = [ Σⱼ wᵢⱼ xⱼ – x̄ Σⱼ wᵢⱼ ] / [ S √{ (N Σⱼ wᵢⱼ² – (Σⱼ wᵢⱼ)²) / (N–1) } ]</strong></div>

      <table class="doc-table">
        <tr><th>Symbol</th><th>Meaning</th></tr>
        <tr><td>Gi*</td><td>The Gi* score for each individual location i</td></tr>
        <tr><td>wᵢⱼ</td><td>Spatial weight between location i and j</td></tr>
        <tr><td>xⱼ</td><td>Value of the attribute at neighboring location j</td></tr>
        <tr><td>x̄</td><td>Global mean of the attribute across all locations</td></tr>
        <tr><td>N</td><td>Total number of spatial units</td></tr>
        <tr><td>S</td><td>Standard deviation of attribute values</td></tr>
      </table>

      <div class="sub-heading">Interpretation of Gi* Results</div>
      <table class="doc-table">
        <tr><th>Gi* Z-score</th><th>Type</th><th>What It Means</th></tr>
        <tr><td>High Positive + p &lt; 0.05</td><td><strong>HOTSPOT</strong></td><td>Location and neighbors have unusually HIGH values — significant high-value cluster</td></tr>
        <tr><td>High Negative + p &lt; 0.05</td><td><strong>COLDSPOT</strong></td><td>Location and neighbors have unusually LOW values — significant low-value cluster</td></tr>
        <tr><td>Near 0 + p &gt; 0.05</td><td>Not Significant</td><td>Pattern at this location is random. Cannot be called hotspot or coldspot.</td></tr>
      </table>

      <div class="sub-heading">Confidence Levels in Gi* Mapping</div>
      <table class="doc-table">
        <tr><th>Confidence Level</th><th>Meaning</th></tr>
        <tr><td>99% (p &lt; 0.01)</td><td>Very strong evidence. Only 1% chance pattern is random.</td></tr>
        <tr><td>95% (p &lt; 0.05)</td><td>Standard scientific threshold. Strong evidence. 5% false detection chance.</td></tr>
        <tr><td>90% (p &lt; 0.10)</td><td>Moderate evidence. Use in exploratory analysis only.</td></tr>
        <tr><td>Not Significant (p &gt; 0.10)</td><td>Grey on map. No meaningful spatial pattern. Do NOT report as cluster.</td></tr>
      </table>

      <div class="sub-heading">Key Difference: Moran's I vs. Gi*</div>
      <table class="doc-table">
        <tr><th>Feature</th><th>Moran's I</th><th>Gi*</th></tr>
        <tr><td>Scale</td><td>GLOBAL — one result for whole area</td><td>LOCAL — result for each location</td></tr>
        <tr><td>Output</td><td>Single index value</td><td>Z-score and p-value per location</td></tr>
        <tr><td>Purpose</td><td>Detects IF clustering exists</td><td>Detects WHERE hotspots/coldspots are</td></tr>
      </table>

      <div class="gis-box">
        <div class="gis-label">GIS/RS Example — Flood Risk Hotspot Detection</div>
        <p>During flood season, a GIS analyst applies Gi* to rainfall data from 200 weather stations. Results show a 99% confidence hotspot in the northern hilly zone and a coldspot in the southern plains — enabling disaster teams to pre-position rescue resources before flooding occurs.</p>
      </div>

      <div class="sub-heading">Summary — Topic 1 Key Points</div>
      <ul class="doc-list">
        <li>Spatial autocorrelation measures similarity between neighboring locations based on Tobler's First Law.</li>
        <li>Positive autocorrelation = clustering; Negative = dispersion; Zero = random.</li>
        <li>Moran's I is a GLOBAL statistic ranging from -1 to +1. High positive = strong clustering.</li>
        <li>Statistical significance is checked using Z-score and p-value (p &lt; 0.05 = significant).</li>
        <li>Gi* is a LOCAL statistic identifying exact hotspot and coldspot locations per feature.</li>
        <li>Confidence levels: 90%, 95%, 99% — higher = stronger evidence of clustering.</li>
        <li>In ArcGIS Pro or QGIS, Spatial Autocorrelation and Hotspot Analysis tools implement these methods.</li>
      </ul>
    </div>

  <!-- TOPIC 2 -->
  <div class="doc-page">
    <div class="content-page">
      <div class="topic-banner">
        <div class="topic-banner-left">
          <div class="tag">MAS 744 — Geospatial Statistics- II</div>
          <h2>POINT PATTERN ANALYSIS</h2>
        </div>
        <div class="topic-banner-right">02</div>
      </div>

      <div class="section-heading"><span class="snum">2.1</span> Point Pattern Analysis</div>
      <div class="sub-heading">Definition</div>
      <div class="body-text">Point Pattern Analysis (PPA) is a set of statistical methods used to examine the spatial distribution of discrete point locations. It studies whether a set of points (disease cases, tree locations, crime events, earthquake epicenters) are arranged in a <strong>RANDOM, CLUSTERED, or DISPERSED</strong> pattern across a geographic area.</div>

      <div class="sub-heading">Three Types of Spatial Point Patterns</div>
      <table class="doc-table">
        <tr><th>Pattern</th><th>Description</th><th>Real-World GIS Example</th></tr>
        <tr><td><strong>Random</strong></td><td>Points scattered with no specific order. Null hypothesis = CSR.</td><td>Random placement of lightning strike locations on flat terrain.</td></tr>
        <tr><td><strong>Clustered</strong></td><td>Points group in specific areas due to an underlying driver. Most common in nature.</td><td>Disease cases near contaminated water; fire hotspots in dry forest regions.</td></tr>
        <tr><td><strong>Dispersed</strong></td><td>Points more evenly spaced than random — suggests competition or planning.</td><td>Mobile phone towers at regular distances; wells deliberately spaced in a field.</td></tr>
      </table>

      <div class="note-box">Null Hypothesis: Complete Spatial Randomness (CSR). All PPA tests compare observed patterns to CSR. CSR assumes: equal probability for any location, independence of each point, and Poisson distribution of point counts.</div>

      <div class="section-heading"><span class="snum">2.2</span> Method 1: Nearest Neighbour Analysis (NNA)</div>
      <div class="body-text">NNA measures the average distance from each point to its nearest neighboring point and compares this to the expected distance under CSR (Complete Spatial Randomness).</div>

      <div class="formula-box"><strong>NNR = d(obs) / d(exp) &nbsp;&nbsp;&nbsp; where &nbsp;&nbsp;&nbsp; d(exp) = 0.5 / √(n/A)</strong></div>

      <table class="doc-table">
        <tr><th>Symbol</th><th>Meaning</th></tr>
        <tr><td>NNR</td><td>Nearest Neighbour Ratio — final result indicating pattern type</td></tr>
        <tr><td>d(obs)</td><td>Observed mean nearest-neighbour distance</td></tr>
        <tr><td>d(exp)</td><td>Expected mean nearest-neighbour distance under CSR</td></tr>
        <tr><td>n</td><td>Total number of points</td></tr>
        <tr><td>A</td><td>Total area of the study region</td></tr>
      </table>

      <div class="sub-heading">Interpretation of NNR</div>
      <table class="doc-table">
        <tr><th>NNR Value</th><th>Pattern</th><th>Meaning</th></tr>
        <tr><td><strong>NNR &lt; 1</strong></td><td>CLUSTERED</td><td>Points closer together than random. Real process is causing clustering.</td></tr>
        <tr><td><strong>NNR = 1</strong></td><td>RANDOM (CSR)</td><td>Observed distances match expected. No spatial structure detected.</td></tr>
        <tr><td><strong>NNR &gt; 1</strong></td><td>DISPERSED</td><td>Points more spread out than random. Suggests planning or competition.</td></tr>
        <tr><td>NNR = 2.15 (max)</td><td>PERFECTLY DISPERSED</td><td>Maximum theoretical value — perfect hexagonal spacing.</td></tr>
      </table>

      <div class="formula-box"><strong>Z = (d(obs) – d(exp)) / SE &nbsp;&nbsp;&nbsp; where &nbsp;&nbsp;&nbsp; SE = 0.26136 / √(n²/A)</strong><br><em>If |Z| &gt; 1.96 and p &lt; 0.05 → statistically significant pattern</em></div>

      <div class="gis-box">
        <div class="gis-label">GIS/RS Example — Tree Location Analysis</div>
        <p>A forest ecologist maps GPS locations of 500 trees in a protected forest. NNA in QGIS gives NNR = 0.42, Z = -8.7, p &lt; 0.001 — trees are SIGNIFICANTLY CLUSTERED due to seed dispersal patterns. This guides forest management decisions.</p>
      </div>
    </div>
    ${footerHtml(name,pid,ts,4,course)}
  </div>

  <!-- PAGE RIPLEY -->
  <div class="doc-page">
    <div class="content-page">
      <div class="section-heading"><span class="snum">2.3</span> Method 2: Ripley's K Function</div>
      <div class="body-text">Ripley's K function is an advanced <strong>multi-scale</strong> point pattern analysis method. Instead of only looking at nearest neighbor distance, it counts points within successively larger circle radii to detect clustering or dispersion at MULTIPLE spatial scales simultaneously. Developed by Brian Ripley in 1976.</div>

      <div class="formula-box"><strong>K(r) = (A / n²) × Σᵢ Σⱼ (1 / wᵢⱼ) × I(dᵢⱼ &lt; r) &nbsp;&nbsp; for i ≠ j</strong></div>

      <div class="sub-heading">The L Function — Standardized Version of K</div>
      <div class="formula-box"><strong>L(r) = √[K(r) / π] – r</strong></div>

      <table class="doc-table">
        <tr><th>L(r) Value</th><th>Pattern Interpretation</th></tr>
        <tr><td>L(r) &gt; 0 (above CSR envelope)</td><td>CLUSTERING at that distance scale — more points than expected within radius r</td></tr>
        <tr><td>L(r) = 0 (on CSR line)</td><td>RANDOM pattern at that scale — same as expected under CSR</td></tr>
        <tr><td>L(r) &lt; 0 (below CSR envelope)</td><td>DISPERSION at that scale — fewer points than expected</td></tr>
      </table>

      <div class="sub-heading">NNA vs. Ripley's K</div>
      <table class="doc-table">
        <tr><th>Feature</th><th>NNA</th><th>Ripley's K</th></tr>
        <tr><td>Scale Analysis</td><td>ONE scale — nearest neighbor only</td><td>MULTIPLE scales from 0 to max distance</td></tr>
        <tr><td>Pattern Detail</td><td>Single ratio (NNR)</td><td>Full curve showing pattern change with distance</td></tr>
        <tr><td>Detection Power</td><td>Misses multi-scale patterns</td><td>Detects clustering at local AND dispersion at regional scale</td></tr>
        <tr><td>Complexity</td><td>Simple to calculate manually</td><td>Requires GIS software (QGIS, ArcGIS, R)</td></tr>
      </table>

      <div class="gis-box">
        <div class="gis-label">GIS/RS Example — Malaria Case Distribution</div>
        <p>A researcher maps 300 malaria case GPS locations. Ripley's K in ArcGIS Pro shows the L-function rises above CSR at 0–2 km then drops back at 5 km — malaria is CLUSTERED at village scale but random at larger scales, directing health interventions to village cluster level.</p>
      </div>

      <div class="section-heading"><span class="snum">2.4</span> Kernel Density Estimation (KDE)</div>
      <div class="body-text">KDE creates a continuous smooth density surface (raster) from point data, showing where points are most densely concentrated. Each point spreads as a smooth 'kernel' (bell-shaped) and contributions are summed at every location to create a density map. Widely used in crime analysis, wildlife ecology, accident mapping, and disease surveillance.</div>

      <div class="formula-box"><strong>f(x) = (1 / n×h) × Σ K((x – xᵢ) / h)</strong></div>

      <table class="doc-table">
        <tr><th>Bandwidth Setting</th><th>Effect on Output</th></tr>
        <tr><td>Small Bandwidth (h small)</td><td>Very localized, bumpy surface. Captures fine details. Risk of over-fitting.</td></tr>
        <tr><td>Large Bandwidth (h large)</td><td>Very smooth, generalized surface. Shows broad regional patterns. Risk of over-smoothing.</td></tr>
        <tr><td>Optimal Bandwidth</td><td>Balance between detail and smoothness. Use cross-validation or Silverman's rule of thumb.</td></tr>
      </table>

      <div class="section-heading"><span class="snum">2.5</span> Complete Workflow in GIS</div>
      <ul class="doc-list">
        <li><strong>Collect Point Data:</strong> GPS survey (Survey123, QField), digitizing, or satellite imagery extraction.</li>
        <li><strong>Load into GIS:</strong> Import CSV/shapefile into ArcGIS Pro or QGIS.</li>
        <li><strong>Define Study Area:</strong> Set boundary polygon for analysis region.</li>
        <li><strong>Conduct NNA:</strong> Get NNR and check if pattern is random, clustered, or dispersed.</li>
        <li><strong>Apply Ripley's K:</strong> Multi-scale analysis — see at which distances clustering occurs.</li>
        <li><strong>Run KDE:</strong> Create visual density surface (raster) showing hotspot zones.</li>
        <li><strong>Apply Gi* Analysis:</strong> Statistically rigorous hotspot detection with confidence levels.</li>
        <li><strong>Validate Results:</strong> Check output against ground truth and other spatial layers.</li>
        <li><strong>Map &amp; Report:</strong> Create hotspot maps with legend, scale bar, north arrow, and interpretation.</li>
      </ul>

      <div class="sub-heading">Summary — Topic 2 Key Points</div>
      <ul class="doc-list">
        <li>Point Pattern Analysis examines if distributions are Random, Clustered, or Dispersed.</li>
        <li>Null hypothesis = CSR (Complete Spatial Randomness — Poisson process).</li>
        <li>NNA: NNR &lt; 1 = Clustered; NNR = 1 = Random; NNR &gt; 1 = Dispersed. Always test with Z-score.</li>
        <li>Ripley's K is multi-scale: L(r) &gt; 0 = clustering; L(r) &lt; 0 = dispersion at distance r.</li>
        <li>KDE creates smooth density surface; bandwidth (h) is the critical parameter.</li>
        <li>GIS workflow: NNA → Ripley's K → KDE → Gi* for decision-making.</li>
      </ul>
    </div>
